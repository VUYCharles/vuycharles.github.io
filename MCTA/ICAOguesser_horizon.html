<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>ICAOguesser</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Commit+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- Mode clair (défaut) --- */
            --fond: #F2F5F4;
            --carte: #E4EBE8;
            --carte-survol: #F8FAFA;
            --texte: #1E2D3A;
            --brume: #8A9CA8;
            --accent: #A4C4B4;
            --secondaire: #A4B8CC;
            --survol: #D4A89A;
            --ombre-carte: 0 2px 8px rgba(30, 45, 58, 0.04);
            --focus: #A4C4B4;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Commit Mono', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fond: #131820;
                --carte: #1A2130;
                --carte-survol: #222C3A;
                --texte: #E0E6E4;
                --brume: #6E7E8A;
                --accent: #B0A4C8;
                --secondaire: #C8A0B0;
                --survol: #D4A0B4;
                --ombre-carte: 0 2px 8px rgba(0, 0, 0, 0.2);
                --focus: #B0A4C8;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: auto;
        }

        body, html {
            height: 100%;
            font-family: var(--font-sans);
            background-color: var(--fond);
            color: var(--texte);
            overflow: hidden;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 4px;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: var(--fond);
        }

        /* --- BARRE HAUTE --- */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--fond);
            border-bottom: 1px solid var(--carte);
            color: var(--texte);
            padding: 16px 24px;
            box-sizing: border-box;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 22px;
            font-weight: 500;
            color: var(--texte);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .mode-selector {
            display: flex;
            gap: 24px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--brume);
            padding: 0;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: none;
        }

        .mode-btn:hover { color: var(--survol); }
        .mode-btn.active {
            color: var(--texte);
        }
        .mode-btn.active:hover { color: var(--texte); }

        .score-board {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--brume);
        }

        .score-board span {
            color: var(--texte);
        }

        /* --- PANNEAU DE JEU --- */
        #game-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--carte-survol);
            border: 1px solid var(--carte);
            border-radius: 8px;
            box-shadow: var(--ombre-carte);
            padding: 24px 32px;
            z-index: 1000;
            text-align: center;
            color: var(--texte);
            width: 85%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .target-label {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--brume);
            margin-bottom: 8px;
        }

        #target-icao {
            font-family: var(--font-sans);
            font-size: 40px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--texte);
        }

        #feedback {
            margin: 16px 0;
            font-family: var(--font-mono);
            font-weight: 400;
            font-size: 16px;
            line-height: 1.5;
            min-height: 44px;
            color: var(--texte);
        }

        .points-awarded {
            font-family: var(--font-mono);
            font-size: 14px;
            display: block;
            margin-top: 6px;
        }

        #next-btn {
            background: var(--accent);
            color: var(--carte-survol);
            border: none;
            padding: 12px 30px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: none;
            width: 100%;
        }

        #next-btn:hover { background: var(--survol); }

        /* --- CRÉDIT --- */
        #watermark {
            position: absolute;
            top: 68px;
            right: 24px;
            z-index: 1000;
            color: var(--brume);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* --- LEAFLET : recolorer les contrôles et popups --- */
        .leaflet-bar {
            box-shadow: none;
            border: 1px solid var(--carte) !important;
        }
        .leaflet-bar a {
            background-color: var(--carte-survol);
            color: var(--texte);
            transition: none;
        }
        .leaflet-bar a:hover {
            background-color: var(--carte);
        }

        .leaflet-popup-content-wrapper {
            background: var(--carte-survol);
            color: var(--texte);
            border-radius: 8px;
            box-shadow: var(--ombre-carte);
            text-align: center;
            font-family: var(--font-mono);
        }
        .leaflet-popup-tip {
            background: var(--carte-survol);
            box-shadow: none;
        }
        .leaflet-popup-content { font-size: 14px; }
        .leaflet-popup-content b { font-family: var(--font-sans); font-weight: 500; }

        /* --- ADAPTATION MOBILE --- */
        @media (max-width: 768px) {
            #top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 12px 16px;
            }
            .controls-wrapper {
                width: 100%;
                justify-content: space-between;
                gap: 16px;
            }
            .mode-selector { gap: 16px; }
            .mode-btn { font-size: 14px; }
            #watermark {
                top: 96px;
                right: 16px;
                font-size: 12px;
            }
            #game-panel {
                bottom: 90px;
                padding: 20px;
            }
            #target-icao {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="brand">ICAOguesser</div>

        <div class="controls-wrapper">
            <div class="mode-selector">
                <button id="btn-europe" class="mode-btn active" onclick="switchMode('europe')">Europe</button>
                <button id="btn-france" class="mode-btn" onclick="switchMode('france')">France</button>
            </div>
            <div class="score-board">
                Score : <span id="score">0</span>
            </div>
        </div>
    </div>

    <div id="watermark">
        MCTA25C
    </div>

    <div id="game-panel">
        <div class="target-label">Localisez l'aéroport</div>
        <div id="target-icao">----</div>
        <div id="feedback">Appuyez sur la carte !</div>
        <button id="next-btn" style="display: none;" onclick="nextRound()">Suivant</button>

            { icao: 'LFOT', name: 'Tours', lat: 47.4322, lng: 0.7272 },
            { icao: 'LFPN', name: 'Toussus-le-Noble', lat: 48.7511, lng: 2.1064 },
            { icao: 'LFQB', name: 'Troyes', lat: 48.3228, lng: 4.0192 },
            { icao: 'LFLU', name: 'Valence', lat: 44.9214, lng: 4.9694 }
        ];

        let currentMode = 'europe';
        let currentList = airportsEurope;

        let currentAirport = null;
        let score = 0;
        let isWaitingForNext = false;

        let currentMarker = null;
        let userMarker = null;
        let line = null;

        // Palette Horizon v3.0 — résolue dynamiquement selon prefers-color-scheme
        function getPalette() {
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            return dark
                ? { accent: '#B0A4C8', mid: '#6E7E8A', far: '#E0E6E4', onColor: '#222C3A', shadow: 'rgba(0,0,0,0.35)' }
                : { accent: '#A4C4B4', mid: '#8A9CA8', far: '#1E2D3A', onColor: '#F8FAFA', shadow: 'rgba(30,45,58,0.2)' };
        }

        const map = L.map('map', { zoomControl: false }).setView([48.0, 10.0], 5);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const tileUrl = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

        const tileLayer = L.tileLayer(tileUrl, {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19,
            noWrap: true
        }).addTo(map);

        switchMode('europe');

        function switchMode(mode) {
            currentMode = mode;
            score = 0;
            updateScoreBoard();

            document.getElementById('btn-europe').classList.remove('active');
            document.getElementById('btn-france').classList.remove('active');

            const isMobile = window.innerWidth <= 768;

            // Zéro mouvement : positionnement instantané, sans vol animé
            if (mode === 'europe') {
                document.getElementById('btn-europe').classList.add('active');
                currentList = airportsEurope;
                map.setView([50.0, 10.0], isMobile ? 3 : 4);
            } else {
                document.getElementById('btn-france').classList.add('active');
                currentList = airportsFrance;
                map.setView([46.5, 2.5], isMobile ? 5 : 6);
            }
            nextRound();
        }

        function updateScoreBoard() {
            document.getElementById('score').innerText = score;
        }

        function nextRound() {
            if (currentMarker) map.removeLayer(currentMarker);
            if (userMarker) map.removeLayer(userMarker);
            if (line) map.removeLayer(line);

            isWaitingForNext = false;
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('feedback').innerHTML = "Appuyez sur la carte !";

            const isMobile = window.innerWidth <= 768;

            if (currentMode === 'europe') {
                map.setView([50.0, 10.0], isMobile ? 3 : 4);
            } else {
                map.setView([46.5, 2.5], isMobile ? 5 : 6);
            }

            const randomIndex = Math.floor(Math.random() * currentList.length);
            currentAirport = currentList[randomIndex];

            document.getElementById('target-icao').innerText = currentAirport.icao;
        }

        function calculatePoints(distanceKm, mode) {
            if (distanceKm <= 5) return 5000;
            const scale = mode === 'europe' ? 120 : 40;
            return Math.max(0, Math.round(5000 * Math.exp(-distanceKm / scale)));
        }

        map.on('click', function(e) {
            if (isWaitingForNext || !currentAirport) return;

            const palette = getPalette();

            const targetLatLng = L.latLng(currentAirport.lat, currentAirport.lng);
            const distance = e.latlng.distanceTo(targetLatLng);
            const distanceKm = Math.round(distance / 1000);

            const roundPoints = calculatePoints(distanceKm, currentMode);
            score += roundPoints;

            // Trois états : proche (accent), moyen (brume), loin (texte principal)
            // Le rose/lavande de survol n'est jamais utilisé ici à l'état statique.
            let colorStatus = palette.mid;
            if (distanceKm <= 30) colorStatus = palette.accent;
            else if (distanceKm > 150 && currentMode === 'france') colorStatus = palette.far;
            else if (distanceKm > 300 && currentMode === 'europe') colorStatus = palette.far;

            const targetIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style='background-color:${colorStatus}; width:14px; height:14px; border-radius:50%; border:2px solid ${palette.onColor}; box-shadow:0 2px 8px ${palette.shadow};'></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            userMarker = L.circleMarker(e.latlng, {
                color: palette.accent, fillColor: palette.accent, fillOpacity: 1, radius: 6, weight: 2
            }).addTo(map);

            currentMarker = L.marker(targetLatLng, {icon: targetIcon}).addTo(map)
                .bindPopup(`<b>${currentAirport.name}</b><br>${currentAirport.icao}`).openPopup();

            line = L.polyline([e.latlng, targetLatLng], { color: palette.far, weight: 2, dashArray: '5, 8' }).addTo(map);

            const isMobile = window.innerWidth <= 768;
            const maxZ = currentMode === 'europe' ? (isMobile ? 3 : 4) : (isMobile ? 5 : 6);

            map.fitBounds(L.latLngBounds([e.latlng, targetLatLng]), {
                padding: [50, 50],
                maxZoom: maxZ,
                animate: false
            });

            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerHTML = `Lieu : <b style="color:${colorStatus}">${currentAirport.name}</b> (${distanceKm} km)<br><span class="points-awarded" style="color:${colorStatus}">+${roundPoints} pts</span>`;

            updateScoreBoard();
            isWaitingForNext = true;

            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = "inline-block";
            nextBtn.style.background = colorStatus;
            nextBtn.style.color = palette.onColor;
        });
    </script>
</body>
</html>
